<!doctype html>
<html lang="fil">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Self-hosted fonts (src/styles/fonts.css): Bricolage Grotesque for headings and figures,
         DM Serif Display italic for short emphasis, Inter for reading and money. Preload the
         latin files the first screen uses. -->
    <link rel="preload" href="/fonts/bricolage-grotesque-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/dm-serif-display-italic-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preconnect" href="%PORTAL_API%" crossorigin>
    <title>%PORTAL_TITLE%</title>
    <meta name="description" content="%PORTAL_DESCRIPTION%" />
    <meta name="theme-color" content="#050d22" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%PORTAL_NAME%" />
    <meta property="og:title" content="%PORTAL_TITLE%" />
    <meta property="og:description" content="%PORTAL_DESCRIPTION%" />
    %PORTAL_URL_META%
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>Kailangan ng JavaScript ang portal na ito. Nasa https://budget.bettergov.ph/hgab/2027/overview din ang bawat proyekto.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
